[program:document-queue-emails]
; Supervisor configuration for Document Module Queue Worker on Linux
; This process monitors the 'emails' queue and dispatches email jobs

; ============================================================================
; BASIC CONFIGURATION
; ============================================================================

process_name=%(program_name)s_%(process_num)d
command=/usr/bin/php /var/www/manager/artisan queue:work --queue=emails --tries=3 --timeout=60 --max-jobs=1000 --max-time=3600
autostart=true
autorestart=true
user=www-data
group=www-data
numprocs=2
redirect_stderr=true

; ============================================================================
; LOGGING
; ============================================================================

stdout_logfile=/var/log/supervisor/document-queue-emails.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stdout_capture_maxbytes=1MB
stderr_logfile=/var/log/supervisor/document-queue-emails-errors.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10

; ============================================================================
; PROCESS MANAGEMENT
; ============================================================================

; Grace time for graceful shutdown
stopwaitsecs=10

; Kill strategy if stop fails
stopsignal=TERM

; Process priority
priority=999

; Environment variables
environment=PATH="/usr/local/bin:/usr/bin:/bin",HOME=/var/www,USER=www-data

; ============================================================================
; EVENT LISTENERS (Optional but recommended)
; ============================================================================

; Listen to process state events
events=PROCESS_STATE

; Restart process if it fails
startsecs=10
startretries=3
