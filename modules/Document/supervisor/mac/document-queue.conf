[program:document-queue-emails]
; Supervisor configuration for Document Module Queue Worker on macOS
; This process monitors the 'emails' queue and dispatches email jobs

; ============================================================================
; BASIC CONFIGURATION
; ============================================================================

process_name=%(program_name)s_%(process_num)d
command=/opt/homebrew/opt/php@8.4/bin/php /Users/functionbytes/Function/Coding/manager/artisan queue:work --queue=emails --tries=3 --timeout=60 --max-jobs=1000 --max-time=3600
autostart=true
autorestart=true
user=functionbytes
numprocs=2
redirect_stderr=true

; ============================================================================
; LOGGING
; ============================================================================

stdout_logfile=%(ENV_HOME)s/.supervisor/logs/document-queue-emails.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stdout_capture_maxbytes=1MB
stderr_logfile=%(ENV_HOME)s/.supervisor/logs/document-queue-errors.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10

; ============================================================================
; PROCESS MANAGEMENT
; ============================================================================

; Grace time for graceful shutdown
stopwaitsecs=10

; Kill strategy if stop fails
stopsignal=TERM

; Process priority
priority=999

; Environment variables
environment=PATH="/opt/homebrew/opt/php@8.4/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin",HOME=%(ENV_HOME)s,USER=functionbytes

; ============================================================================
; EVENT LISTENERS (Optional but recommended)
; ============================================================================

; Listen to process state events
events=PROCESS_STATE

; Restart process if it fails
startsecs=10
startretries=3
