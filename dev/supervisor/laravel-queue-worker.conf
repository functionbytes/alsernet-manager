# ═══════════════════════════════════════════════════════════════
# LARAVEL QUEUE WORKERS - CONSOLIDADO
# ═══════════════════════════════════════════════════════════════
# Este archivo reemplaza a:
#   - alsernet-queue-all.conf (ELIMINAR)
#   - alsernet-queue-erp.conf (ELIMINAR)
#   - laravel-queue-worker.conf antiguo (REEMPLAZAR)
#
# Instrucciones:
# 1. Copiar este archivo a: /etc/supervisor/conf.d/laravel-queue-worker.conf
# 2. Ejecutar como root:
#    - supervisorctl reread
#    - supervisorctl update
#    - supervisorctl restart all
# ═══════════════════════════════════════════════════════════════

# Worker 1: Procesa colas generales (default, emails, notifications)
[program:laravel-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home2/webadmin/web/artisan queue:work --queue=default,emails,notifications --sleep=1 --tries=1
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/home2/webadmin/web/storage/logs/laravel-queue-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
user=www-data
startsecs=10
stopwaitsecs=3600
priority=999

# Worker 2: Procesa cola ERP
[program:laravel-queue-erp]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home2/webadmin/web/artisan queue:work --queue=erp --sleep=1 --tries=1
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/home2/webadmin/web/storage/logs/laravel-queue-erp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
user=www-data
startsecs=10
stopwaitsecs=3600
priority=999
